esphome:
  name: agilent-33120a-bridge
  friendly_name: Agilent 33120A Serial Bridge

esp8266:
  board: d1_mini

external_components:
  - source: github://oxan/esphome-stream-server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.50
    gateway: 192.168.1.1
    subnet: 255.255.255.0

captive_portal:

api:
ota:
  - platform: esphome

# Log over UART1 (TX-only on GPIO2) so UART0 is free for the instrument.
logger:
  hardware_uart: UART1
  level: INFO

# UART0 swapped to GPIO15 (TX) / GPIO13 (RX) so the USB serial chip
# doesn't fight the MAX3232 while flashing/debugging.
uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 2
  rx_buffer_size: 512

stream_server:
  uart_id: uart_bus
  port: 6638

binary_sensor:
  - platform: stream_server
    connected:
      name: "33120A Bridge Connected"

sensor:
  - platform: wifi_signal
    name: "33120A Bridge WiFi RSSI"
    update_interval: 60s
